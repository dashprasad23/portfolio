<!-- Normal Navbar -->
<div class="fixed top-4 left-1/2 transform -translate-x-1/2 w-[90%] max-w-6xl z-50" *ngIf="!isScrolled && !isBlogRoute">
  <div class="bg-black bg-opacity-60 text-white px-6 py-4 flex justify-between items-center rounded-xl shadow-lg">
    <div class="text-xl font-bold">Debiprasad Das</div>
    <nav class="space-x-6 hidden md:flex">
      <a routerLink="/" class="hover:underline">About</a>
      <a routerLink="/blogs" class="hover:underline">Blogs</a>
      <a href="#skills" class="hover:underline">Skills</a>
      <a href="#projects" class="hover:underline">Projects</a>
      <a href="#experience" class="hover:underline">Experience</a>
      <a href="#contact" class="hover:underline">Contact</a>
    </nav>
    <button (click)="isMobileMenuOpen = !isMobileMenuOpen" class="md:hidden text-xl">☰</button>
  </div>
</div>

<!-- Scrolled Navbar -->
<nav class="fixed top-0 left-0 w-full transition-all duration-300 z-50 bg-white shadow-md text-gray-800" *ngIf="isScrolled || isBlogRoute">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <div class="text-2xl font-bold">Debiprasad Das</div>
    <div class="space-x-6 hidden md:flex">
      <a routerLink="/" class="hover:underline">About</a>
      <a routerLink="/blogs" class="hover:underline">Blogs</a>
      <a href="#skills" class="hover:underline">Skills</a>
      <a href="#projects" class="hover:underline">Projects</a>
      <a href="#experience" class="hover:underline">Experience</a>
      <a href="#contact" class="hover:underline">Contact</a>
    </div>
    <button (click)="isMobileMenuOpen = !isMobileMenuOpen" class="md:hidden text-2xl">☰</button>
  </div>
</nav>

<!-- Mobile Full-Width Sidebar -->
<div
  *ngIf="isMobileMenuOpen"
  class="fixed inset-0 bg-black bg-opacity-60 z-50 md:hidden"
  (click)="isMobileMenuOpen = false"
>
  <div
    class="absolute top-0 left-0 h-full w-full bg-white text-gray-800 shadow-lg p-6"
    (click)="$event.stopPropagation()"
  >
    <button (click)="isMobileMenuOpen = false" class="text-2xl mb-6 float-right">✕</button>
    <div class="clear-both"></div>
    <nav class="flex flex-col items-center gap-6 mt-10 text-xl font-medium">
      <a routerLink="/" (click)="isMobileMenuOpen = false" class="hover:underline">About</a>
      <a routerLink="/blogs" (click)="isMobileMenuOpen = false" class="hover:underline">Blogs</a>
      <a href="#skills" (click)="isMobileMenuOpen = false" class="hover:underline">Skills</a>
      <a href="#projects" (click)="isMobileMenuOpen = false" class="hover:underline">Projects</a>
      <a href="#experience" (click)="isMobileMenuOpen = false" class="hover:underline">Experience</a>
      <a href="#contact" (click)="isMobileMenuOpen = false" class="hover:underline">Contact</a>
    </nav>
  </div>
</div>
