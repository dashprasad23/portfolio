<section id="blog" class="w-full bg-white py-20 px-6 flex flex-col items-center">
  <h2 class="text-3xl font-bold text-blue-600 mb-2">Latest Blog Posts</h2>
  <p class="text-gray-600 text-center max-w-2xl mb-10">
    Sharing insights, experiences, and ideas from my journey in tech.
  </p>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-6xl w-full">
    <div *ngFor="let blog of blogs" class="bg-blue-50 rounded-xl shadow-md p-6 hover:shadow-lg transition">
      <img [src]="blog.image" alt="{{ blog.title }}" class="w-full h-40 object-cover rounded mb-4" />
      <h3 class="text-xl font-semibold text-gray-800 mb-2">{{ blog.title }}</h3>
      <p class="text-sm text-gray-600 mb-4">{{ blog.summary }}</p>
      <a [href]="blog.url" target="_blank" class="text-blue-600 hover:underline text-sm">
        Read more →
      </a>
    </div>
  </div>
</section>
